name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # End-to-end tests run against the real backend. If ca-backend is private, add a
      # BACKEND_REPO_TOKEN secret (fine-grained token with read access to ca-backend).
      - uses: actions/checkout@v4
        with:
          repository: admin-stilltyping/ca-backend
          path: ca-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r ca-backend/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BACKEND_DIR: ca-backend
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
